version: '3.8'

services:
  bot:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - WEBHOOK_BASE_URL=http://localhost:5000
    depends_on:
      - redis
    volumes:
      - ./app.py:/app/app.py:ro  # hot reload in dev

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data: